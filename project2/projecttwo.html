<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task List</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="projecttwo.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center">Task Manager</h1>

    <!-- Task Form -->
    <form id="taskForm" class="my-4">
      <div class="mb-3">
        <label for="taskTitle" class="form-label">Task Title</label>
        <input type="text" id="taskTitle" class="form-control" placeholder="Enter task title" required>
      </div>
      <div class="mb-3">
        <label for="taskPriority" class="form-label">Task Priority</label>
        <select id="taskPriority" class="form-select" required>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Task Status</label><br>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="taskStatus" id="statusPending" value="pending" checked>
          <label class="form-check-label" for="statusPending">Pending</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="taskStatus" id="statusCompleted" value="completed">
          <label class="form-check-label" for="statusCompleted">Completed</label>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Add Task</button>
    </form>

    <!-- Task List -->
    <h2 class="mt-4">Task List</h2>
    <ul id="taskList" class="list-group"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
